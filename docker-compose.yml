services:

  # ── Secrets ──────────────────────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Vault secret seeder (runs once, exits) ───────────────────────────────────
  vault-init:
    image: hashicorp/vault:1.17
    container_name: vault-init
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    command: >
      sh -c "
        vault kv put secret/llm/groq_api_key value=$$GROQ_API_KEY &&
        vault kv put secret/llm/anthropic_api_key value=$$ANTHROPIC_API_KEY &&
        vault kv put secret/jwt/signing_key value=$$JWT_SECRET
      "
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"

  # ── Database ─────────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maintainers_copilot
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maintainers_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Cache ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Blob storage ──────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Experiment tracking ───────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    container_name: mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow

  # ── Tracing ───────────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger
    ports:
      - "${JAEGER_PORT:-16686}:16686"
      - "${JAEGER_GRPC_PORT:-4317}:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migrations (run once, exit) ───────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: migrate
    command: alembic upgrade head
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: maintainers_copilot
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    restart: "no"

  # ── API ───────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_NAME: maintainers_copilot
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      OTLP_ENDPOINT: http://jaeger:4317
      MODELSERVER_URL: http://modelserver:8001
      HF_HOME: /hf_cache
    volumes:
      - ~/.cache/huggingface:/hf_cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      vault-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Model server ──────────────────────────────────────────────────────────────
  modelserver:
    build:
      context: .
      dockerfile: Dockerfile.modelserver
    container_name: modelserver
    ports:
      - "${MODELSERVER_PORT:-8001}:8001"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      - ./models:/app/models:ro
    depends_on:
      vault-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # ── Chatbot (Streamlit) ────────────────────────────────────────────────────────
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile.chatbot
    container_name: chatbot
    ports:
      - "${CHATBOT_PORT:-8501}:8501"
    environment:
      API_URL: http://api:8000
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN}
      PYTHONPATH: /app
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Widget static server ───────────────────────────────────────────────────────
  widget:
    image: nginx:alpine
    container_name: widget
    ports:
      - "8080:80"
    volumes:
      - ./widget/dist:/usr/share/nginx/html:ro
      - ./widget/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ── Demo host app ──────────────────────────────────────────────────────────────
  host:
    image: nginx:alpine
    container_name: host
    ports:
      - "8090:80"
    volumes:
      - ./demo/host:/usr/share/nginx/html:ro
    restart: unless-stopped

  # ── Evil host (unauthorized origin — CSP demo) ────────────────────────────────
  evil-host:
    image: nginx:alpine
    container_name: evil-host
    ports:
      - "8099:80"
    volumes:
      - ./demo/evil:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  db_data:
  minio_data:
  mlflow_data:

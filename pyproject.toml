[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainers-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "python-multipart==0.0.9",

    # Auth (Phase 4)
    "fastapi-users[sqlalchemy]==13.0.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",

    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.13.3",
    "asyncpg==0.29.0",
    "pgvector==0.3.5",

    # Cache
    "redis[asyncio]==5.1.1",

    # Secrets
    "hvac==2.3.0",

    # Blob
    "boto3==1.35.36",

    # Tracing
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-api==1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.27.0",
    "opentelemetry-instrumentation-fastapi==0.48b0",

    # Dataset
    "PyGithub==2.4.0",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "joblib==1.4.2",

    # DL track (Phase 2)
    "torch==2.2.2",
    "transformers==4.44.2",
    "accelerate>=0.26.0",
    "numpy<2",

    # RAG (Phase 3)
    "sentence-transformers>=2.7.0",
    "rank-bm25>=0.2.2",

    # LLM (Phase 3+)
    "anthropic==0.34.2",
    "groq>=0.11.0",
    "tiktoken==0.7.0",

    # Utils
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
